# neutronOS alacritty configuration
#
# Alacritty has no split panes on purpose: niri's columns are the splits, so a
# terminal that also splits would be redundant. Tabs (Shift+Tab) still work if
# you want them.

[font]
size = 12.0

[font.normal]
family = "JetBrains Mono"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"
bright_black = "#585b70"
bright_red = "#f38ba8"
bright_green = "#a6e3a1"
bright_yellow = "#f9e2af"
bright_blue = "#89b4fa"
bright_magenta = "#f5c2e7"
bright_cyan = "#94e2d5"
bright_white = "#a6adc8"

[cursor]
style = { shape = "Block", blinking = "On" }

[window]
opacity = 0.95
decorations = "Full"

[terminal]
shell = { program = "/usr/bin/fish" }
