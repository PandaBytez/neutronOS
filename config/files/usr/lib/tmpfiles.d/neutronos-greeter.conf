# /var/lib/noctalia-greeter is the greeter's state directory: it holds
# greeter.toml, sync.toml and any wallpapers the Noctalia shell syncs to the login
# screen.
#
# It has to be created by systemd-tmpfiles at BOOT, not by a build-time mkdir. In
# a bootc/rpm-ostree image /var is a separate persistent partition, so anything a
# build wrote there is not part of the deployment and will not exist on the running
# system. A tmpfiles.d drop-in in /usr does ship, and systemd-tmpfiles-setup runs
# before greetd starts.
#
# Ownership is the greetd session user declared in /etc/greetd/config.toml, which
# post-install.sh writes. sysusers creates that user earlier in the boot, before
# tmpfiles runs, so naming it here is safe. Note the upstream package ships no
# tmpfiles.d of its own -- Terra's spec deletes it -- and the upstream drop-in
# hardcodes a "greeter" user that does not exist on Fedora.
d /var/lib/noctalia-greeter 0750 greetd greetd -
