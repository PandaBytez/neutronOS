# On the live installer ISO the console belongs to neutronos-install.service, so
# greetd must not come up and grab vt1. The condition does that cleanly instead of
# a race between two units both wanting the same VT: a skipped unit costs nothing,
# whereas Conflicts= between them produces a visible tug-of-war on the console and
# sometimes leaves neither usable.
#
# On an installed system the argument is absent, this file is a no-op, and the
# Noctalia Greeter works exactly as it does anywhere else.
[Unit]
ConditionKernelCommandLine=!neutronos.live