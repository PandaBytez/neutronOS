# neutronOS -- niri + Noctalia Blueprint (BlueBuild)
# https://blue-build.org/reference/recipe/
#
# Terminal-focused, scrollable-tiling atomic DESKTOP for development:
#   compositor -> niri (Fedora main)
#   shell      -> Noctalia (Fedora main)
#   terminal   -> ghostty (Terra -- not packaged in Fedora)
#   greeter    -> noctalia-greeter (Terra), with tuigreet as fallback
#   base       -> ublue-os/base-main, stock signed Fedora kernel
#
# Third-party sources, both deliberate and both minimal:
#   - Flathub, for the four flatpaks
#   - the base `terra` repo, for ghostty, jetbrainsmono-nerd-fonts and
#     noctalia-greeter ONLY. terra-release-extras is never installed;
#     verify-desktop.sh asserts it and the mesa/nvidia/multimedia subrepos are
#     absent, because that subrepo ships patched versions of Fedora packages.
#
# This name is the GHCR image path: ghcr.io/<owner>/neutronos
# It must be lowercase: BlueBuild emits it as a Containerfile stage name
# (`FROM <name>`) and OCI rejects uppercase stage names. The registry lowercases
# the path regardless, so the camelCase "neutronOS" can only live in the repo
# name, never in the image reference.
name: neutronos
description: Terminal-focused scrollable-tiling atomic dev desktop with niri, Noctalia and distrobox
# base-main is base-atomic + the ublue layer: NO desktop at all, the stock
# signed Fedora kernel (from ublue-os/akmods), Mesa/Intel from negativo17's
# fedora-multimedia repo, Flathub as the default remote, ublue-os-just and the
# ublue hardware + update services.
#
# It replaced bazzite-gnome when this stopped being a gaming image. That base
# brought the OGC kernel and Steam, and neither could be removed in place: OGC
# *is* Bazzite's default kernel, and Steam's dependency closure holds the
# firmware/Mesa layer the display depends on. A base change is the only clean
# way to drop the gaming stack.
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # 1. /usr/local is a symlink to ../var/usrlocal and does not exist in a build
  #    container, so anything writing there fails with "File exists" and, under
  #    set -e, aborts the script silently doing nothing.
  - type: script
    scripts:
      - pre-install.sh

  # 2. Core packages. Everything here is in Fedora 44 main. niri pulls
  #    xwayland-satellite; ddcutil/cliphist/wlsunset are Noctalia's optional
  #    dependencies. Ghostty is NOT here -- it comes from Terra in step 4.
  - type: rpm-ostree
    install:
      # Compositor, shell, greeter
      - niri
      - noctalia
      - greetd
      - greetd-selinux
      # tuigreet is the FALLBACK greeter, not the one in use. noctalia-greeter
      # is the default, but it is a young project and it runs before
      # authentication: if it fails to start, the machine has no login screen at
      # all and needs a live USB to recover. tuigreet costs one small RPM and
      # gives a one-line way back in. The README documents the switch.
      - tuigreet

      # D-Bus is a hard requirement of noctalia-greeter-session (it drives the
      # compositor wrapper), and polkit is what lets Noctalia's "Sync Now" copy
      # wallpaper, palette and font to the login screen via pkexec.
      - dbus-daemon
      - polkit

      # Portals. niri ships /usr/share/xdg-desktop-portal/niri-portals.conf and
      # implements screencast via the GNOME backend, so both are required.
      - xdg-desktop-portal
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk

      # Shell
      - fish

      # Session infrastructure, declared EXPLICITLY rather than inherited.
      #
      # base-main has no desktop, so several things a session silently depends
      # on may be absent or may be absent in a future base bump. Naming them here
      # makes the image deterministic: an `rpm-ostree install` of something
      # already present is a no-op, and verify-desktop.sh asserts every one of
      # them, so losing one fails the build instead of failing on someone's
      # laptop. NetworkManager is the important one -- this is a laptop image,
      # and a base bump that drops it leaves the machine with no Wi-Fi after a
      # reboot.
      #
      # Mesa is deliberately NOT listed, even though it is obviously required.
      # ublue-os/main's install script already pulls mesa-dri-drivers,
      # mesa-libEGL, mesa-libGL, mesa-libgbm and mesa-vulkan-drivers from
      # negativo17's fedora-multimedia repo at priority 90, then *versionlocks*
      # them. Asking rpm-ostree to install an already-present, versionlocked
      # package is at best a no-op and at worst a versionlock conflict. The gate
      # still asserts the packages are present -- the assertion is about the
      # capability, not about who provides it. See the README.
      - pipewire
      - wireplumber
      - gnome-keyring
      - gnome-keyring-pam
      - gvfs
      - avahi
      - bluez
      - NetworkManager

      # Noctalia drives monitor brightness through ddcutil. On the old
      # bazzite-gnome base this was terra-ddcutil (Provides: ddcutil) and
      # installing Fedora's ddcutil on top failed with "conflicting requests".
      # base-main has no terra repo, so the Fedora package is correct here.
      - ddcutil
      - accountsservice
      - cliphist
      - wlsunset
      - brightnessctl
      - playerctl
      - wl-clipboard

      # --- Development layer ---
      #
      # Containers. This is an immutable image: native toolchains never update
      # without a rebuild, so language toolchains belong in containers. podman
      # ships in the base; podman-docker adds the `docker` CLI so Docker-only
      # instructions in docs work verbatim.
      - podman
      - podman-docker
      # There is deliberately NO `uidmap` here. Fedora puts newuidmap and
      # newgidmap in shadow-utils, which the base already has; `uidmap` is the
      # *Debian* package name for the same binaries and does not exist in Fedora at
      # all. Naming it broke the build outright -- "Packages not found: uidmap" --
      # because it had been carried over from the gaming base, whose extra repos
      # happened to carry it. verify-desktop.sh asserts `newuidmap` on PATH
      # instead: the capability rootless podman actually needs, independent of
      # which RPM provides it.
      - distrobox

      # Native build tools. NOT optional despite the container strategy:
      # Rust needs a C linker and `cc`, Go needs cgo, and `podman build` runs
      # on the host -- so every toolchain in a distrobox links against these.
      - gcc
      - gcc-c++
      - make
      - cmake
      - ninja-build
      - pkgconf-pkg-config
      - gdb

      # Terminal quality-of-life. Everything here is Fedora main -- with the
      # obvious exception of `lazygit`, which is not packaged for Fedora at all
      # (same reason Ghostty is not). It is a `brew install lazygit` away, and
      # Homebrew is in this image, so it is not worth a third-party repo.
      - git
      - git-delta
      - git-lfs
      - ripgrep
      - fd-find
      - bat
      - eza
      - tree
      - fzf
      - zoxide
      - direnv
      - tmux
      - gh
      - jq
      - yq
      - shellcheck
      - shfmt
      - btop
      - sqlite
      - man-pages

      # Laptop battery. A DE-less niri session ships NO power daemon at all --
      # GNOME's power-profiles-daemon and KDE's powerdevil are both absent --
      # so TLP is the only thing managing CPU governor, USB autosuspend and
      # audio codec power. It also exposes ThinkPad charge thresholds and
      # battery recalibration. Do not add tlp-pd: that is the power-profiles-
      # daemon integration, and there is no power-profiles-daemon here.
      - tlp

  # 3. Enable the Terra repository. Must come AFTER the Fedora install above and
  #    BEFORE the Ghostty install below -- see the script header for why the
  #    ordering is load-bearing rather than cosmetic.
  - type: script
    scripts:
      - terra-repo.sh

  # 4. The terminal, the font and the greeter. Separate from the main install
  #    because these only exist in Terra: Ghostty is not packaged in Fedora at
  #    all, Fedora's `jetbrains-mono-fonts` is the plain font without the Nerd
  #    glyphs that eza/bat/fzf/git-delta need to render their icons, and the
  #    greeter is Terra-only too.
  - type: rpm-ostree
    install:
      - ghostty
      - jetbrainsmono-nerd-fonts
      - noctalia-greeter

  # 5. Homebrew for user-managed CLI & TUI packages
  - type: brew

  # 6. Pre-installed flatpaks
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        install:
          - io.github.kolunmi.Bazaar
          - io.gitlab.librewolf-community
          - it.mijorus.gearlever
          - com.ranfdev.DistroShelf

  # 7. Default user skeleton: niri config, ghostty config, fish config
  - type: files
    files:
      - source: etc/skel
        destination: /etc/skel

  # 8. Post-install adjustments. Runs after the flatpak module so the browser
  #    MIME default is not raced by the flatpak install.
  - type: script
    scripts:
      - post-install.sh

  # 9. Seed the niri + Noctalia defaults
  - type: script
    scripts:
      - niri-defaults.sh

  # 10. Fail the build if the desktop is not niri-only or the dev layer is absent
  - type: script
    scripts:
      - verify-desktop.sh
